# The fixed tagging schema. Describes decision behaviour generically.
# It contains no assumed user problem, theme or barrier — every theme code comes
# from the pilot (config/codebook.yaml).
#
# in_scope is the first field and the first decision. It is defined by the locked
# rubric in docs/labelling_guide.md (base rule + complaint exception): posts that
# fail it are excluded from every analysis table but stay in the database.
#
# Changing this file changes what the LLM is asked to produce. Do not add
# brand-specific or problem-specific values here.

enum:
  journey_stage:
    - browsing
    - saved_or_wishlisted
    - in_cart
    - comparing
    - postponed
    - abandoned
    - purchased
    - returned
    - other
  barrier_type:
    - informational        # user lacks information to decide
    - confidence           # user does not trust their own judgement
    - social               # what others think, dress code, gifting pressure
    - occasion_timing      # wedding, festival, season, deadline
    - decision_comparison  # too many options, cannot narrow down
    - trust                # trust in the platform, seller or product
    - financial            # price, discount, budget
    - functional           # size, fit, features, quality
    - none                 # no barrier mentioned
    - other
  severity:
    min: 1
    max: 5
    note: "1 = mild annoyance, 5 = the post says the problem stopped them buying"
  confidence:
    min: 0
    max: 1
  codes_per_post:
    min: 1
    max: 4
  evidence_quote:
    max_words: 25
    must_be_verbatim: true   # checked against the original post text; reject if not found

fields:
  in_scope:
    type: object
    description: >
      THE FIRST DECISION. value is true only when the post is in scope for analysis,
      under the locked rubric in docs/labelling_guide.md: the base rule ("a post is
      relevant if it describes any part of a fashion buying journey") with the
      complaint exception ("a pure post-purchase complaint is NOT relevant unless it
      links back to that journey"). reason is one line naming the phrase in the post
      that decided it. When value is false, every other field is null and the post is
      excluded from all analysis — the row and this verdict stay in the database. If
      this description and docs/labelling_guide.md ever disagree, the guide wins.
    properties:
      value: boolean
      reason: string
  journey_stage:
    type: enum
    description: Where the user is in the decision journey, as stated in the post.
  saving_behaviour:
    type: object
    properties:
      text: string      # why the item was saved, in the user's own terms
      code: string      # codebook code, or null if not stated
    description: Only when the post mentions saving or wishlisting. Otherwise null.
  codes:
    type: list
    item: string        # codebook code
    description: 1-4 codebook codes that this post supports.
  primary_code:
    type: string
    description: The single best code from `codes`.
  stated_reason:
    type: string
    description: What the user explicitly says is the reason. Quote-level only.
  underlying_reason:
    type: string
    description: The likely deeper reason if it differs from stated_reason, else null.
  barrier_type:
    type: enum
    description: The main thing standing between the user and the purchase.
  external_sources:
    type: list
    item: string
    description: Other places the user says they checked. Empty list if none.
  comparison_behaviour:
    type: string
    description: How the user compares, if mentioned. Null otherwise.
  segment_cues:
    type: object
    description: Only what the text supports. Null when unknown — never guess.
    properties:
      gender: string
      life_stage: string
      city_tier: string
      price_sensitivity: string
      shopping_frequency: string
      category: string
  unmet_need:
    type: string
    description: One normalised sentence, or null.
  severity:
    type: enum
  evidence_quote:
    type: string
    description: Verbatim substring of the post, 25 words or fewer.
  confidence:
    type: number

# Stored as individual SQLite columns for easier filtering.
segment_cue_columns:
  - gender
  - life_stage
  - city_tier
  - price_sensitivity
  - shopping_frequency
  - category