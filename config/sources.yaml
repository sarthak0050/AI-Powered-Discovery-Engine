# Which posts to collect. Scope is Myntra only.
# Edit this file to change what gets collected — no code changes needed.

target:
  brand: Myntra

date_range:
  # Months of history to collect. Reddit sources are unreliable for deep history,
  # so the collectors stop cleanly when a source runs out.
  months_back: 24

playstore:
  enabled: true
  app_id: com.myntra.android      # verified: "Myntra - Fashion Shopping App", 100M+ installs
  lang: en
  country: in
  sort: newest                    # newest first, so recent behaviour dominates
  limit: 50000                   # stop at this many reviews for this source.
                                # Myntra serves roughly 475 reviews a day, so 50k
                                # covers about 3.5 months of daily behaviour:
                                # comfortably past the point where recent
                                # behaviour has settled, and still ~5x the
                                # 1,500-post target once duplicates are removed.
                                # Reaching a 24-month window from Play Store
                                # alone would need roughly 350,000 reviews, which
                                # this source does not serve. Older coverage has
                                # to come from App Store, Reddit and YouTube.
  page_size: 100                  # reviews per request; keeps us polite
  delay_seconds: 1.0              # pause between pages
  max_pages: 10000                # hard stop, so a bug can never loop forever

appstore:
  enabled: true
  # Verified against Apple's own lookup API, not assumed:
  #   trackId 907394059 = "Myntra - Fashion Shopping App"
  #   seller Myntra Designs Private Limited, bundle com.myntra.Myntra
  #   the only Myntra app listed in the Indian storefront
  # Re-checked by `python run.py doctor` on every run.
  app_id: "907394059"
  storefront: in                  # India only
  sort: mostrecent
  delay_seconds: 3                # polite delay between requests
  # The feed's ceiling, measured rather than assumed:
  #   50 reviews per page
  #   page 11 onward answers HTTP 400, so 10 pages is the hard stop
  #   10 x 50 = 500 reviews, which is the most this source will ever give
  pages: 10
  page_size: 50
  limit: 500                      # 10 pages x 50 reviews
  # The feed only ever covers the most recent few days, so this source adds an iOS
  # perspective rather than extra history. Old coverage must come from Reddit,
  # YouTube and the App Store web pages.
  on_zero_reviews: error_and_mark_unavailable   # never save an empty file

reddit:
  enabled: true
  # Arctic Shift is a free volunteer API with no uptime guarantee, so the rules
  # below are measured behaviour, not preferences. Verified on this machine:
  #   - keyword search REQUIRES a subreddit; there is no global text search
  #   - adding `sort` to a keyword query returns 422 "Timeout", so never sort here
  #   - `after` must be supplied or the query times out
  #   - page 11+ style deep pagination is unreliable; this collector walks the
  #     date range instead and bisects it when the server times out
  #   - 429 arrives after a handful of quick calls. X-RateLimit-Reset says how many
  #     seconds to wait, and it is obeyed rather than guessed
  base_url: https://arctic-shift.photon-reddit.com/api
  # Every name below was confirmed to exist via /api/subreddits/search.
  # The two Myntra-specific communities are the highest-signal sources by far.
  subreddits:
    - Myntradiscount
    - MyntraSucks
    - IndianFashionAddicts
    - IndianFashionTribe
    - IndianFashionIcons
    - IndianFashionFit
    - indianfashiontrend
    - IndianFashion
    - IndianFashionAdda
    - OnlineShopping
    - indianshoppingdeals
    - mumbai
    - delhi
    - bangalore
    - hyderabad
    - pune
    - chennai
    - kolkata
    - ahmedabad
    - gurgaon
    - noida
    - jaipur
  # Neutral commerce and clothing words. Deliberately not biased toward any
  # hypothesis: the point is to catch people describing their shopping experience,
  # not people already complaining about a feature we suspect.
  search_terms:
    - fashion
    - shopping
    - clothes
    - clothing
    - dress
    - dresses
    - apparel
    - outfit
    - wear
    - style
    - purchase
    - bought
    - order
    - delivery
    - product
    - quality
    - size
    - fit
    - price
    - return
    - refund
    - exchange
  query: myntra            # the brand we require to be present
  months_back: 24          # default date range
  include_comments: true
  # Also sweep comments directly, to catch comments that mention Myntra inside
  # threads whose post did not match. Comment search is Postgres full-text and
  # much slower, so it is allowed to fail without stopping the run.
  search_comments_directly: true
  page_size: 100
  delay_seconds: 6         # this is a free volunteer service: pace requests
  max_pages_per_subreddit: 5
  # Requests allowed per subreddit before it is left partially covered. A free
  # volunteer API is not worth exhausting, so coverage is bounded rather than total.
  requests_per_subreddit: 8
  max_warmup_retries: 2     # the docs say a cold query often works on a second try
  title_fallback: true      # title-only search is cheaper and often succeeds
  min_split_days: 60       # do not bisect a window smaller than this
  max_comments_per_post: 300
  max_retries: 3
  on_error: skip_and_log   # a dead subreddit must not stop the others

youtube:
  enabled: true           # needs YOUTUBE_API_KEY in .env
  queries:
    - myntra review
    - myntra shopping experience
    - myntra returns refund
  max_videos_per_query: 5
  max_comments_per_video: 40
  order: relevance
  # search.list costs 100 quota units, commentThreads.list costs 1 per 100 comments
  cache_search_results: true

manual:
  enabled: true
  # Drop any CSV into data/manual/ with these columns and it is picked up:
  # text,date,author,source_note,url
  glob: "*.csv"

# Neutral search terms for sources that need a query string.
search_terms:
  - myntra
  - myntra app

# Milestone 2 reads this. Kept here so nothing about post quality lives in code.
# Note: there is no minimum word count on purpose. Short reviews are kept because
# they are real sentiment, and their volume is a finding in itself.
clean:
  min_length_words: 0
  near_duplicate_similarity: 0.95