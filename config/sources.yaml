# Which posts to collect. Scope is Myntra only.
# Edit this file to change what gets collected — no code changes needed.

target:
  brand: Myntra

date_range:
  # Months of history to collect. Reddit sources are unreliable for deep history,
  # so the collectors stop cleanly when a source runs out.
  months_back: 24

playstore:
  enabled: true
  app_id: com.myntra.android      # verified: "Myntra - Fashion Shopping App", 100M+ installs
  lang: en
  country: in
  sort: newest                    # newest first, so recent behaviour dominates
  limit: 50000                   # stop at this many reviews for this source.
                                # Myntra serves roughly 475 reviews a day, so 50k
                                # covers about 3.5 months of daily behaviour:
                                # comfortably past the point where recent
                                # behaviour has settled, and still ~5x the
                                # 1,500-post target once duplicates are removed.
                                # Reaching a 24-month window from Play Store
                                # alone would need roughly 350,000 reviews, which
                                # this source does not serve. Older coverage has
                                # to come from App Store, Reddit and YouTube.
  page_size: 100                  # reviews per request; keeps us polite
  delay_seconds: 1.0              # pause between pages
  max_pages: 10000                # hard stop, so a bug can never loop forever

appstore:
  enabled: true
  # Verified against Apple's own lookup API, not assumed:
  #   trackId 907394059 = "Myntra - Fashion Shopping App"
  #   seller Myntra Designs Private Limited, bundle com.myntra.Myntra
  #   the only Myntra app listed in the Indian storefront
  # Re-checked by `python run.py doctor` on every run.
  app_id: "907394059"
  storefront: in                  # India only
  sort: mostrecent
  delay_seconds: 3                # polite delay between requests
  # The feed's ceiling, measured rather than assumed:
  #   50 reviews per page
  #   page 11 onward answers HTTP 400, so 10 pages is the hard stop
  #   10 x 50 = 500 reviews, which is the most this source will ever give
  pages: 10
  page_size: 50
  limit: 500                      # 10 pages x 50 reviews
  # The feed only ever covers the most recent few days, so this source adds an iOS
  # perspective rather than extra history. Old coverage must come from Reddit,
  # YouTube and the App Store web pages.
  on_zero_reviews: error_and_mark_unavailable   # never save an empty file

reddit:
  enabled: true
  # Arctic Shift is a free volunteer API with no uptime guarantee. It requires a
  # subreddit (it cannot search across all of Reddit), it degrades to 422/429 under
  # repeated calls, and limit=100 times out server-side. Treat as supplementary.
  base_url: https://arctic-shift.photon-reddit.com/api
  subreddits:
    - india
    - IndianStreetBets
    - AskIndia
    - onlineShopping
    - Shopping
  query: myntra
  include_comments: true
  page_size: 5            # verified working size; larger values time out
  delay_seconds: 5
  max_pages_per_subreddit: 4
  treat_as_best_effort: true

youtube:
  enabled: true           # needs YOUTUBE_API_KEY in .env
  queries:
    - myntra review
    - myntra shopping experience
    - myntra returns refund
  max_videos_per_query: 5
  max_comments_per_video: 40
  order: relevance
  # search.list costs 100 quota units, commentThreads.list costs 1 per 100 comments
  cache_search_results: true

manual:
  enabled: true
  # Drop any CSV into data/manual/ with these columns and it is picked up:
  # text,date,author,source_note,url
  glob: "*.csv"

# Neutral search terms for sources that need a query string.
search_terms:
  - myntra
  - myntra app

# Milestone 2 reads this. Kept here so nothing about post quality lives in code.
# Note: there is no minimum word count on purpose. Short reviews are kept because
# they are real sentiment, and their volume is a finding in itself.
clean:
  min_length_words: 0
  near_duplicate_similarity: 0.95