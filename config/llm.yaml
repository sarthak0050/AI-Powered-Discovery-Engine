# LLM settings. Everything here is editable — no code changes needed.
# Change provider or model by editing this file.

provider: gemini           # gemini | groq — default provider for stages not named below
model: gemini-3.5-flash   # best model that actually works on the free tier

# Every stage that must not drift names its provider here. There is NO automatic
# fallback anywhere: if a named provider is unavailable the stage stops with a clear
# message and resumes after the reset. Point a stage at another provider by editing
# this map, never by hoping a fallback kicks in.
stage_providers:
  relevance: gemini        # the broad filter over the whole corpus
  in_scope: gemini         # second-stage rubric check
  extraction: gemini       # final tagging against the codebook
  open_coding: gemini      # Module 3 open coding. Switched from Groq on 2026-10-08:
                           #   the first 150 pilot posts were screened by Groq
                           #   (sampling only), the top-up and coding are Gemini.
  theme_naming: gemini     # Module 3 codebook builder (same swap, same note)
  codebook_consolidate: gemini   # Module 3 consolidation: merges the named clusters
                                 # into parent themes + child codes (1 call)
  codebook_recode: gemini        # Module 3 re-code: re-tags the pilot posts against
                                 # the consolidated codebook to measure other_emerging
  judge: groq              # the independent reference judge — hard-pinned, never Gemini

# Model for a stage that runs on a provider other than the default: Groq cannot run a
# Gemini model, so the groq-pinned stages name a groq model here. Gemini stages get
# their model from per_stage_models below.
stage_models:
  judge: openai/gpt-oss-120b

# A cheaper, faster model for the high-volume stages (relevance filtering).
# Set per_stage_models.bulk to null to use the main model everywhere.
#
# The free tier allows 500 requests per day per model, so flash and flash-lite have
# separate allowances. They are NOT equal: gemini-3.5-flash is 20/day, so every stage
# that needs more than a handful of calls runs on flash-lite (see rate_limits below).
# 2026-10-08: theme naming moved to flash-lite after flash hit its 20/day ceiling;
# extraction runs on flash-lite because the full extraction (~280 calls) cannot fit
# flash's allowance.
per_stage_models:
  bulk: gemini-3.5-flash-lite
  precision: gemini-3.5-flash
  in_scope: gemini-3.5-flash-lite       # high-volume screening (16 calls in one top-up)
                                        # could never fit flash's 20/day; a rubric bool is
                                        # within flash-lite's reach, same as relevance
  theme_naming: gemini-3.5-flash-lite   # quality is fine; flash's 20/day is spent today
  extraction: gemini-3.5-flash-lite     # the ~280-call tagging could never fit flash's 20/day
  codebook_consolidate: gemini-3.5-flash-lite  # one merge call over all 57 clusters
  codebook_recode: gemini-3.5-flash-lite       # ~19 calls to re-tag the 369 pilot posts

temperature: 0            # ignored by some Gemini 3 endpoints; JSON schema is what
                          # actually enforces structure (see README "Determinism")
max_retries: 3
timeout_seconds: 90
# Failing to connect is different from a slow answer. Without this, a dead socket after
# the Mac wakes from sleep can sit there until timeout_seconds, three times over, before
# the batch is written off.
connect_timeout_seconds: 15

# Free tier limits. Read out of the providers' own responses, not guessed.
#
# These are PER MODEL, and the two Gemini models are NOT equal:
#   - gemini-3.5-flash:        20 requests/day. From the API's own 429 body on
#                               2026-10-08: quotient metric generate_content_free_tier_requests,
#                               limit: 20, model: gemini-3.5-flash, quotaId
#                               GenerateRequestsPerDayPerProjectPerModel-FreeTier. This is a
#                               HARD ceiling — the run tripped it at exactly 20 ok calls.
#   - gemini-3.5-flash-lite:   500 requests/day. From the API's own 429 body (quotaId
#                               GenerateRequestsPerDayPerModel-FreeTier): "limit: 500,
#                               model: gemini-3.5-flash-lite". The full relevance run logged
#                               exactly 500 successful calls then 429s.
# Both figures are paced 10% below (rpd_by_model) so the throttler stops BEFORE the cap.
# rpm / tpm: UNVERIFIED. The 429s named the per-day metric only and carried no per-minute
# or token figure, and I cannot read your AI Studio rate-limit page from here. These are
# left at Google's commonly published flash-lite free-tier figures and paced 10% below.
# If they are wrong the symptom is 429s during the run, which are now logged separately
# and do not consume the daily allowance, so a wrong guess here costs throughput rather
# than correctness. Check them against AI Studio and correct if needed.
rate_limits:
  gemini:
    rpm: 13               # requests per minute (unverified, see above)
    tpm: 900000           # tokens per minute (unverified, see above)
    rpd: 500              # fallback for unmeasured gemini models
    rpd_by_model:
      gemini-3.5-flash: 18        # paced 10% below the real 20/day ceiling
      gemini-3.5-flash-lite: 450  # paced 10% below the real 500/day ceiling
  groq:
    # rpm / tpm / rpd come from Groq's own response headers:
    #   x-ratelimit-limit-requests: 1000
    #   x-ratelimit-limit-tokens: 8000   (this one is PER MINUTE)
    # Paced 10% below.
    #
    # tpd is the one that is NOT in any header. Groq's real ceiling, from its 429 body:
    #   "Rate limit reached for model `openai/gpt-oss-120b` ... on tokens per day (TPD):
    #    Limit 200000, Used 197508, Requested 4003."
    # Without this the throttler saw 833 requests left and kept sending ~4,000-token
    # batches until the daily token pool was gone, then stalled on 429s for 105 batches.
    # A request count alone does not describe Groq's free tier.
    rpm: 30
    tpm: 7200
    rpd: 900
    tpd: 180000            # tokens per day PER MODEL. Limit 200000, paced 10% below.

# There is no fallback provider anywhere. When a stage's pinned provider is
# unavailable — including a spent daily allowance — the stage stops cleanly with a
# clear message, everything already written is kept, and the same command resumes
# later. This keeps the corpus single-judge for every stage.
on_quota_exhausted: stop_and_resume_tomorrow

batch:
  relevance: 20           # posts per LLM call (section 7, Module 2)
  judge: 10               # rows per call for the independent judge (python run.py
                          # judge-relevance). Kept at 10 rather than 20 because the
                          # rubric rides along in every prompt and groq's tpm is 7,200.
  in_scope: 20            # posts per call for the stage-2 scope check (python run.py
                          # in-scope): 50 kept rows = 3 calls, the 300-post pilot = 15.
  extraction: 20          # posts per LLM call (section 7, Module 4). 20 was chosen on
                          # 2026-10-08 so the full extraction (6,663 relevant posts =
                          # ~334 calls) fits one flash-lite quota window (450 paced):
                          # at 12/call it would be 556 calls and spill into tomorrow.
  open_coding: 10         # posts per call for Module 3 open coding (python run.py pilot)
  theme_naming: 8         # clusters per call for naming the codebook (same command)
  codebook_recode: 20     # posts per call when the consolidated codebook re-tags the
                          # pilot pool: 369 posts = ~19 calls (same command)

cache:
  enabled: true           # every call cached by prompt hash + input id
  db_table: llm_cache