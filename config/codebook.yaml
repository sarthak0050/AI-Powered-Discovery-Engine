- code: reports-false-delivery-status
  label: Reports False Delivery Status
  parent_theme: delivery-and-logistics
  definition: This cluster groups reports of fraudulent or false delivery statuses
    where an app marks a prepaid order as delivered without actual receipt.
  include_when: The poster ties a false delivery status to a purchase decision — money
    lost on an order, or it made them distrust the platform or stop buying from it.
  exclude_when: A delivery status report with no stated effect on buying; standard
    returns or general customer service complaints.
  example_quotes:
  - it's doesn't delivered but in app shows its delivered it's scam i lost my money
  - there deliver partner usually mark the order as delivered, when we do online payment
    without contacting us
