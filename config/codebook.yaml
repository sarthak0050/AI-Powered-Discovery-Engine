codes:
- code: product-and-outfit-link-requests
  label: Product and Outfit Link Requests
  parent_theme: product-discovery-and-recommendations
  definition: This cluster captures comments asking for direct URLs or links to specific
    items featured in posts. Users want to know where to buy the exact product shown.
  include_when: The post explicitly asks for a link, URL, or place to buy a specific
    product.
  exclude_when: The post discusses brand recommendations without asking for a direct
    purchase link.
  example_quotes:
  - Green suit link
  - Linkkk plssssss
- code: brand-and-store-recommendations
  label: Brand and Store Recommendations
  parent_theme: product-discovery-and-recommendations
  definition: This cluster captures requests for brand advice as well as specific
    brand recommendations or reviews given by users.
  include_when: The post recommends a specific brand or asks for brand alternatives
    and reviews.
  exclude_when: The post requests a direct link to a specific clothing item instead
    of brand-level guidance.
  example_quotes:
  - Buy a Birkenstock
  - I think go for Levi's
- code: color-and-style-preferences
  label: Color and Style Preferences
  parent_theme: product-discovery-and-recommendations
  definition: This cluster covers mentions of product colors, including asking for
    specific color links, preferences for bright colors, and noticing differences
    between expected and received colors.
  include_when: The post discusses color choices, requests specific color links, or
    reports color discrepancies.
  exclude_when: The post focuses on general sizing or overall app experience without
    mentioning color.
  example_quotes:
  - Mam can u kindly attach link for the white colour top
  - Bright colours and print, soft fall, just what i was looking for.
- code: sharing-links-and-search-details
  label: Sharing Links and Search Details
  parent_theme: product-discovery-and-recommendations
  definition: This cluster contains posts where users share specific product links,
    purchase sources, or search details with others. It is centered around directing
    others to a specific item.
  include_when: The post shares a direct product link, purchase source, or search
    terms for an item.
  exclude_when: The post asks general questions about sizing or expresses a return
    policy.
  example_quotes:
  - Yes purchas this link
  - 'Search this in Myntra : Stylish Peach-Coloured Women V-Neck Puff Sleeves Fit
    and Flare Maxi Dress MRP ₹2,199 Rating: 4.2 ⭐'
- code: outfit-and-style-suggestions
  label: Outfit and Style Suggestions
  parent_theme: product-discovery-and-recommendations
  definition: This cluster contains requests for clothing styling tips, outfit recommendations,
    or specific garment combinations for upcoming events. It is driven by users asking
    others for fashion advice.
  include_when: The post asks for outfit suggestions, clothing pairings, or style
    recommendations for an event.
  exclude_when: The post reviews purchased items or evaluates product quality without
    asking for fashion advice.
  example_quotes:
