# Streamlit theme for the discovery dashboard.
# Must live at the repository root for Streamlit Community Cloud to pick it up.

[theme]
base = "light"
primaryColor = "#E91E63"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#1F2430"
font = "sans-serif"

[browser]
gatherUsageStats = false
